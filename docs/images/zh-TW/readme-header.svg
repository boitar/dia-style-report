<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" xml:lang="zh-TW" role="img" aria-labelledby="title description">
  <title id="title">Dia 風格報告</title>
  <desc id="description">暖紙色編輯風頭圖，搭配報告頁面插畫。參考 Dia 文件風格的獨立、非官方技能。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#ece7dd"/>
    </linearGradient>
    <pattern id="lines" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40H40" fill="none" stroke="#d8d2c6" stroke-opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1600" height="460" fill="url(#paper)"/>
  <rect width="1600" height="460" fill="url(#lines)"/>
  <path d="M84 94H1070M84 354H1070" fill="none" stroke="#c9c2b5"/>
  <path d="M1118 64V398" fill="none" stroke="#c9c2b5"/>
  <g fill="#55504a" font-family="'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif">
    <text x="84" y="68" font-size="21" letter-spacing="3">獨立實作的報告技能</text>
    <text x="84" y="287" font-size="32">將零散資料，整理成清晰報告。</text>
    <text x="84" y="395" font-size="21" letter-spacing="2">閱讀 / 編輯 / 儲存</text>
    <text x="1070" y="395" font-size="20" text-anchor="end">獨立實作 / 非官方</text>
  </g>
  <text x="78" y="225" fill="#1c1a17" font-family="'Songti TC', 'PMingLiU', 'Noto Serif TC', Georgia, serif" font-size="118" letter-spacing="-2">Dia 風格報告</text>
  <circle cx="1385" cy="236" r="160" fill="#dce3d8" opacity=".7"/>
  <g transform="translate(1186 66) rotate(3 160 164)">
