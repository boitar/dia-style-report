      axes.append(svgNode('line',{'class':'chart-axis',x1:left,x2:horizontal?width-right:left,y1:top+plotHeight,y2:horizontal?top+plotHeight:top}));
      if(!horizontal)axes.append(svgNode('line',{'class':'chart-axis',x1:left,x2:width-right,y1:top+plotHeight,y2:top+plotHeight}));
      chart.points.forEach((point,index)=>{
        const control=chartPointControl(chart,point,index),barClass='chart-bar '+(horizontal?'solid':'outlined')+(point.tone==='muted'?' muted':'');
        if(horizontal){
          const center=top+slot*(index+.5),label=svgNode('text',{'class':'chart-axis-text',x:left-10,y:center-(labels[index].length-1)*7.5+4,'text-anchor':'end','aria-hidden':'true'});
          labels[index].forEach((line,i)=>label.append(svgNode('tspan',{x:left-10,dy:i?15:0},line)));axes.append(label);
          control.append(svgNode('rect',{'class':barClass,x:left,y:center-14,width:ratio(point.value)*plotWidth,height:28}));
          control.append(svgNode('rect',{'class':'chart-hit',x:1,y:top+index*slot,width:width-2,height:slot,rx:2}));
        }else{
          const center=left+slot*(index+.5),barWidth=slot*.7,barHeight=ratio(point.value)*plotHeight;
          control.append(svgNode('rect',{'class':barClass,x:center-barWidth/2,y:top+plotHeight-barHeight,width:barWidth,height:barHeight}));
          control.append(svgNode('rect',{'class':'chart-hit',x:left+slot*index+2,y:top,width:slot-4,height:plotHeight+24,rx:2}));
          const label=svgNode('text',{'class':'chart-axis-text',transform:'translate('+(center+8)+' '+(top+plotHeight+25)+') rotate(-18)','text-anchor':'end','aria-hidden':'true'});
          labels[index].forEach((line,i)=>label.append(svgNode('tspan',{x:0,dy:i?15:0},line)));axes.append(label);
        }
        svg.append(control);
      });
      hint.hidden=width<=available+1;
      if(focused!==null)svg.querySelector('[data-point-index="'+focused+'"]')?.focus({preventScroll:true});
      if(tip){const trigger=svg.querySelector('[data-point-index="'+tip.index+'"]');if(trigger)showChartTooltip(trigger,chart,chart.points[tip.index],tip.pinned);}
    };
    chartViews.push(view);chartContainers.set(viewport,view);chartObserver?.observe(viewport);return article;
  }
  const chartObserver=typeof ResizeObserver==='function'?new ResizeObserver(entries=>{for(const entry of entries)chartContainers.get(entry.target)?.draw();}):null;
  function refreshCharts() {for(const view of chartViews)view.draw();}
  chartTooltip.addEventListener('pointerenter',()=>{tooltipHovered=true;clearTimeout(tooltipTimer);});
  chartTooltip.addEventListener('pointerleave',()=>{tooltipHovered=false;deferChartTooltipClose();});
  document.addEventListener('pointerdown',event=>{if(activeChartPoint&&!activeChartPoint.trigger.contains(event.target)&&!chartTooltip.contains(event.target))hideChartTooltip();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&activeChartPoint){event.preventDefault();hideChartTooltip();}});
  window.addEventListener('resize',()=>{refreshCharts();positionChartTooltip();});
  window.addEventListener('scroll',event=>{
    if(chartTooltip.contains(event.target))return;
    if(activeChartPoint&&(activeChartPoint.pinned||document.activeElement===activeChartPoint.trigger))positionChartTooltip();
    else hideChartTooltip();
  },true);
  window.addEventListener('beforeprint',()=>{hideChartTooltip();for(const view of chartViews)view.lastSize='';refreshCharts();});
  window.addEventListener('afterprint',()=>{for(const view of chartViews)view.lastSize='';refreshCharts();});
  printQuery.addEventListener('change',()=>{hideChartTooltip();for(const view of chartViews)view.lastSize='';refreshCharts();});
  document.fonts?.ready.then(()=>{for(const view of chartViews)view.lastSize='';refreshCharts();});
  const read = path => path.split('/').slice(1).reduce((v,key)=>v[key],data);
  const write = (path,value) => { const keys=path.split('/').slice(1), last=keys.pop(); keys.reduce((v,key)=>v[key],data)[last]=value; };
  function editable(tag,cls,path,multiline=false) {
    const el=make(tag,cls,read(path)); el.dataset.edit=path; el.dataset.multiline=String(multiline); el.setAttribute('aria-description',multiline?ui.editDescription:ui.editDescriptionSingleLine);
    fields.set(path,el); return el;
  }
  function paragraphs(parent,values,path,cls='') { (values||[]).forEach((_,i)=>parent.append(editable('p',cls,path+'/'+i,true))); }
  function tableView(table,path) {
    const el=make('table','comparison'); el.setAttribute('role','table');
    if(table.caption)el.append(editable('caption','',path+'/caption'));
    const head=make('thead'), hr=make('tr'); head.setAttribute('role','rowgroup'); hr.setAttribute('role','row');
    table.headers.forEach((_,i)=>{ const th=editable('th','',path+'/headers/'+i); th.scope='col'; th.setAttribute('role','columnheader'); hr.append(th); }); head.append(hr); el.append(head);
    const body=make('tbody'); body.setAttribute('role','rowgroup');
    table.rows.forEach((row,r)=>{ const tr=make('tr'); row.forEach((_,c)=>{
      tr.setAttribute('role','row'); const td=make('td'), label=make('span','mobile-label',table.headers[c]); td.setAttribute('role','cell'); label.setAttribute('aria-hidden','true');
      const hp=path+'/headers/'+c; if(!mirrors.has(hp))mirrors.set(hp,[]); mirrors.get(hp).push(label);
      td.append(label,editable('span','cell-text',path+'/rows/'+r+'/'+c,true)); tr.append(td);
    }); body.append(tr); }); el.append(body); return el;
  }
  function safeURL(value) { try { const u=new URL(value); return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password ? u.href : null; } catch { return null; } }
  function render() {
    hideChartTooltip();chartObserver?.disconnect();chartViews.length=0;chartContainers.clear();
    badgeObserver?.disconnect();badges.clear();
    root.replaceChildren(); fields.clear(); mirrors.clear();
    const header=make('header','report-header');
    header.append(editable('span','publication','/publication'));
    let dateText=data.date;
    try { dateText=new Intl.DateTimeFormat(reportLanguage,{year:'numeric',month:'long',day:'numeric',weekday:'long',timeZone:'UTC'}).format(new Date(data.date+'T00:00:00Z')); } catch {}
    const stamp=make('span','report-date',dateText);
    if(data.edition){stamp.append(document.createTextNode(' · '),editable('span','','/edition'));} header.append(stamp);
    root.append(header,editable('h1','headline','/title'));
    const intro=make('div','intro'); intro.append(editable('p','lead','/lead',true)); paragraphs(intro,data.intro,'/intro'); root.append(intro);
    if(data.metrics?.length) { const metrics=make('div','metrics'); metrics.style.setProperty('--metric-count',data.metrics.length);
      data.metrics.forEach((metric,i)=>{ const p='/metrics/'+i,cell=make('div','metric'); cell.append(editable('div','metric-value',p+'/value'),editable('div','metric-label',p+'/label')); if(metric.note!==undefined)cell.append(editable('div','metric-note',p+'/note')); metrics.append(cell); }); root.append(metrics); }
    root.append(make('hr','report-rule'));
    let sourceNumber=0;
    data.sections.forEach((section,i)=>{
      const p='/sections/'+i, el=make('section','section'); el.append(editable('h2','section-heading',p+'/title'));
      if(section.intro)el.append(editable('p','section-intro',p+'/intro',true));
      if(section.paragraphs?.length){const prose=make('div','prose');paragraphs(prose,section.paragraphs,p+'/paragraphs');el.append(prose);}
      if(section.table)el.append(tableView(section.table,p+'/table'));
      if(section.items?.length){const items=make('div','section-items');section.items.forEach((item,j)=>{
        const q=p+'/items/'+j, article=make('article','item'),label=make('div','item-label'),body=make('div','item-body');
        label.append(editable('h3','item-title',q+'/title')); if(item.tag)label.append(badgeView(q+'/tag',q));
        if(item.lead)body.append(editable('p','item-lead',q+'/lead',true)); paragraphs(body,item.paragraphs,q+'/paragraphs');
        if(item.bullets?.length){const ul=make('ul','bullets');item.bullets.forEach((_,k)=>ul.append(editable('li','',q+'/bullets/'+k,true)));body.append(ul);}
        if(item.sources?.length){const sources=make('div','sources');item.sources.forEach(source=>{const href=safeURL(source.url);if(!href)return;const a=make('a','cite','['+(++sourceNumber)+'] '+source.label);a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.title=source.date?source.label+' · '+source.date:source.label;sources.append(a);});body.append(sources);}
        article.append(label,body);items.append(article);
      });el.append(items);}
      (section.charts||[]).forEach((chart,j)=>el.append(chartView(chart,p+'/charts/'+j,'chart-title-'+i+'-'+j)));
      root.append(el);
    });
    if(data.conclusion){const conclusion=make('section','conclusion');conclusion.append(editable('h2','','/conclusion/title'));paragraphs(conclusion,data.conclusion.paragraphs,'/conclusion/paragraphs');root.append(conclusion);}
    if(data.footerNote)root.append(editable('p','footer-note','/footerNote',true));
    const tip=make('p','reading-tip editor-ui',ui.readingTip);tip.lang=uiLanguage;root.append(tip);
    document.documentElement.lang=reportLanguage; document.title=data.title;
  }
  function applyAppearance() {
    if(!Object.hasOwn(themes,appearance.theme))appearance.theme='paper';
    if(!Object.hasOwn(fonts,appearance.font))appearance.font='editorial';
    appearance.editing=appearance.editing!==false;
    appearance.badgeTilt=appearance.badgeTilt!==false;
    document.documentElement.dataset.theme=appearance.theme; document.documentElement.dataset.font=appearance.font;
    document.documentElement.dataset.badgeTilt=String(appearance.badgeTilt);
    for(const el of fields.values()){el.contentEditable=appearance.editing?'plaintext-only':'false';if(appearance.editing)el.tabIndex=el.tagName==='TH'&&tableQuery.matches?-1:0;else el.removeAttribute('tabindex');}
    document.querySelectorAll('[data-theme-choice]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.themeChoice===appearance.theme)));
    document.querySelectorAll('[data-font-choice]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.fontChoice===appearance.font)));
    document.getElementById('editingToggle').checked=appearance.editing;
    document.getElementById('badgeTiltToggle').checked=appearance.badgeTilt;
    scheduleBadgeLayout();
    requestAnimationFrame(refreshCharts);
  }
  function update(path,value) {
    if(!fields.has(path)||typeof value!=='string')return;
    write(path,value); edits[path]=value;
    for(const mirror of mirrors.get(path)||[])mirror.textContent=value;
    if(path==='/title')document.title=value||ui.reportTitle;
    if(badges.has(fields.get(path)))scheduleBadgeLayout();
  }
  function persist() {
    clearTimeout(timer);
    try { localStorage.setItem(storageKey,JSON.stringify({revision:embedded.revision,updatedAt,edits,appearance}));storageAvailable=true;status.textContent=ui.savedStatus; }
    catch {storageAvailable=false;status.textContent=ui.storageUnavailableStatus;}
  }
  function changed() {updatedAt=Math.max(Date.now(),updatedAt+1);clearTimeout(timer);timer=setTimeout(persist,350);}
  function syncPanelMode() {
    const modal=!panel.hidden&&sheetQuery.matches;
    backdrop.hidden=!modal; root.inert=modal; gear.inert=modal; skip.inert=modal;
    if(modal){panel.setAttribute('aria-modal','true');document.documentElement.dataset.sheetOpen='true';}
    else {panel.removeAttribute('aria-modal');delete document.documentElement.dataset.sheetOpen;}
  }
  function showPanel(open,restore=false) {
    if(open)hideChartTooltip();
    panel.hidden=!open;gear.setAttribute('aria-expanded',String(open));
    syncPanelMode();
    if(open){const selected=panel.querySelector('[data-theme-choice][aria-pressed="true"]');selected?.focus();}
    else if(restore)gear.focus();
  }
  function downloadHTML() {
    hideChartTooltip();
    if(document.activeElement?.dataset.edit)document.activeElement.blur();
    persist();
    const clone=document.documentElement.cloneNode(true);
    clone.querySelector('.chart-tooltip')?.remove();
    clone.querySelector('#report').replaceChildren();
    clone.querySelector('#themeOptions').replaceChildren(); clone.querySelector('#fontOptions').replaceChildren();
    clone.querySelector('#settingsPanel').hidden=true;clone.querySelector('#settingsBtn').setAttribute('aria-expanded','false');clone.querySelector('#undoEdit').disabled=true;
    clone.querySelector('#settingsPanel').removeAttribute('aria-modal');clone.querySelector('#settingsBackdrop').hidden=true;
    clone.querySelector('#report').inert=false;clone.querySelector('#settingsBtn').inert=false;clone.querySelector('.skip-link').inert=false;delete clone.dataset.sheetOpen;
    clone.querySelector('#saveStatus').textContent=ui.initialStatus;
    const snapshot={data,appearance,revision:embedded.revision,updatedAt};
    clone.querySelector('#reportState').textContent=JSON.stringify(snapshot).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    const blob=new Blob(['<!DOCTYPE html>\n',clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=make('a');
    a.href=url;a.download='report-'+data.date+'.html';a.hidden=true;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
    status.textContent=ui.exportedStatus;
  }
  render();
  try {
    const draft=JSON.parse(localStorage.getItem(storageKey)||'null');
    if(draft&&draft.revision===embedded.revision&&Number(draft.updatedAt)>updatedAt){
      for(const [path,value]of Object.entries(draft.edits||{})){if(fields.has(path)&&typeof value==='string'){update(path,value);fields.get(path).textContent=value;}}
      if(draft.appearance&&typeof draft.appearance==='object')Object.assign(appearance,draft.appearance);
      updatedAt=Number(draft.updatedAt);status.textContent=ui.restoredStatus;
    }
  } catch {storageAvailable=false;status.textContent=ui.draftUnavailableStatus;}
  for(const [key,[paper,ink]]of Object.entries(themes)){const b=make('button','theme-option',ui.themes[key]);b.dataset.themeChoice=key;b.style.setProperty('--swatch-paper',paper);b.style.setProperty('--swatch-ink',ink);b.addEventListener('click',()=>{appearance.theme=key;applyAppearance();changed();});document.getElementById('themeOptions').append(b);}
  for(const [key,name]of Object.entries(fonts)){const b=make('button','font-option',name);b.dataset.fontChoice=key;b.addEventListener('click',()=>{appearance.font=key;applyAppearance();changed();});document.getElementById('fontOptions').append(b);}
  applyAppearance();
  gear.addEventListener('click',()=>showPanel(panel.hidden));
  backdrop.addEventListener('click',()=>showPanel(false,true));
  sheetQuery.addEventListener('change',syncPanelMode);
  tableQuery.addEventListener('change',applyAppearance);
  document.getElementById('closeSettings').addEventListener('click',()=>showPanel(false,true));
  document.getElementById('editingToggle').addEventListener('change',event=>{appearance.editing=event.target.checked;applyAppearance();changed();});
  document.getElementById('badgeTiltToggle').addEventListener('change',event=>{appearance.badgeTilt=event.target.checked;applyAppearance();changed();});
  document.getElementById('saveHTML').addEventListener('click',downloadHTML);
  undo.addEventListener('click',()=>{const entry=history.pop();if(!entry)return;update(entry.path,entry.before);fields.get(entry.path).textContent=entry.before;undo.disabled=!history.length;changed();status.textContent=ui.undoStatus;});
  root.addEventListener('focusin',event=>{const el=event.target;if(el.dataset.edit)focusBefore={path:el.dataset.edit,value:read(el.dataset.edit)};});
  root.addEventListener('focusout',event=>{const el=event.target;if(el.dataset.edit&&focusBefore?.path===el.dataset.edit){const after=read(el.dataset.edit);if(after!==focusBefore.value){history.push({path:el.dataset.edit,before:focusBefore.value,after});if(history.length>50)history.shift();undo.disabled=false;}focusBefore=null;}});
  root.addEventListener('focusin',scheduleBadgeLayout);
  root.addEventListener('focusout',scheduleBadgeLayout);
  root.addEventListener('input',event=>{const el=event.target;if(!el.dataset.edit)return;update(el.dataset.edit,el.innerText.replace(/\r\n?/g,'\n'));changed();});
  root.addEventListener('paste',event=>{const el=event.target.closest('[data-edit]');if(!el||!appearance.editing)return;event.preventDefault();const plain=event.clipboardData.getData('text/plain');document.execCommand('insertText',false,plain);});
  root.addEventListener('drop',event=>{if(event.target.closest('[data-edit]'))event.preventDefault();});
  root.addEventListener('keydown',event=>{const el=event.target;if(!el.dataset.edit)return;if(event.key==='Escape'||(event.key==='Enter'&&el.dataset.multiline==='false'&&!event.isComposing)){event.preventDefault();el.blur();}});
  document.addEventListener('keydown',event=>{
    if(panel.hidden)return;
    if(event.key==='Escape'){event.preventDefault();showPanel(false,true);}
    else if(event.key==='Tab'&&sheetQuery.matches){
      const controls=Array.from(panel.querySelectorAll('button:not(:disabled),input:not(:disabled)')),first=controls[0],last=controls[controls.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    }
  });
  document.addEventListener('pointerdown',event=>{if(!panel.hidden&&!sheetQuery.matches&&!panel.contains(event.target)&&!gear.contains(event.target))showPanel(false);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer)persist();});
  window.addEventListener('pagehide',()=>{if(timer)persist();});
})();
</script>
